<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>@@TITLE@@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0f1318;--bar:#171c22;--line:#2b333b;--fg:#e8ebee;--mute:#97a2ac;--acc:#f0b43f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f4;--bar:#fff;--line:#d9dfe4;--fg:#1c2329;--mute:#5d6872;--acc:#b97800}}
:root[data-theme="light"]{--bg:#eef1f4;--bar:#fff;--line:#d9dfe4;--fg:#1c2329;--mute:#5d6872;--acc:#b97800}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#bar{display:flex;align-items:center;gap:6px;padding:6px max(16px,env(safe-area-inset-left,0px));background:var(--bar);border-bottom:1px solid var(--line);flex:none}
#bar b{font-size:14px;margin-inline-end:auto}
.tab{font:inherit;font-size:13px;padding:7px 16px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);color:#16120a;border-color:var(--acc);font-weight:600}
#fr{flex:1;min-height:0;position:relative}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#toast{position:fixed;bottom:16px;inset-inline:16px;max-width:520px;margin:auto;background:var(--bar);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:13px;display:none;z-index:9}
</style>
<div id="bar"><b>@@BAR@@</b><button class="tab" id="t_3" role="tab" aria-selected="true">3D المجسم</button><button class="tab" id="t_4" role="tab" aria-selected="false">4D الجدول الزمني</button><button class="tab" id="t_5" role="tab" aria-selected="false">5D التكلفة</button></div>
<div id="fr"></div><div id="toast" role="status"></div>
<script type="text/plain" id="s3">@@S3@@</script>
<script type="text/plain" id="s4">@@S4@@</script>
<script type="text/plain" id="sd">@@SD@@</script>
<script>
const $=id=>document.getElementById(id),un=id=>$(id).textContent.replace(/<\\\/script/g,'</script');
const T3=un('s3'),T4=un('s4'),D0=JSON.parse(un('sd')),KEY='@@KEY@@',fr=$('fr');let F={},cur='3';
let MEM=null;function saved(){if(MEM)return MEM;try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function mk(k,note){if(F[k])F[k].remove();const f=document.createElement('iframe');f.title=k+'D';
 if(k==='3')f.srcdoc=T3;else{const tp=T4;const d=Object.assign({},saved()||D0);d.mode=k==='5'?'5d':'4d';if(note)d.note=note;const j=JSON.stringify(d).replace(/<\//g,'<\\/');f.srcdoc=tp.replace('__DATA__',()=>j)}
 fr.appendChild(f);F[k]=f;show()}
function show(){for(const k in F)F[k].style.display=k===cur?'block':'none';['3','4','5'].forEach(k=>$('t_'+k).setAttribute('aria-selected',k===cur))}
function go(k){cur=k;if(!F[k])mk(k);else show()}
$('t_3').onclick=()=>go('3');$('t_4').onclick=()=>go('4');$('t_5').onclick=()=>go('5');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',6000)}
addEventListener('message',async e=>{const m=e.data;if(!m||!m.bim)return;
 if(m.bim==='newdata'){let kept=true;try{localStorage.setItem(KEY,JSON.stringify(m.data))}catch(x){kept=false}
  MEM=m.data;const tb=m.tab||'4',nt=m.summary+(kept?'':' (مش هيتحفظ بعد إعادة فتح الصفحة)');['4','5'].forEach(k=>{if(F[k]||k===tb)mk(k,nt)});cur=tb;show();toast('تم التحديث: '+m.summary)}
 else if(m.bim==='reset'){MEM=null;try{localStorage.removeItem(KEY)}catch(x){}['4','5'].forEach(k=>{if(F[k])mk(k,'رجعنا للبيانات الأصلية')});toast('رجع الـ 4D للبيانات الأصلية')}
 else if(m.bim==='export'){try{const dl=window.claude&&await claude.use('downloads');if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([m.data]));a.download=m.filename;document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل '+m.filename);return}await dl.save({filename:m.filename,data:m.data});toast('تم حفظ '+m.filename)}catch(x){toast(x&&x.code==='declined'?'تم إلغاء الحفظ':'تعذر الحفظ: '+(x&&x.message||x))}}});
go('3');
</script>
</body></html>
